<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>StockHive</title>

<style>
:root{
  --bg:#0b0d12;
  --panel:#151922;
  --panel2:#0e1219;
  --text:#e7e9ee;
  --muted:#a8b0c2;
  --border:#2a3142;
  --btn:#1b2231;
  --btnHover:#232c3f;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(96,165,250,.08), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(167,139,250,.06), transparent 55%),
    linear-gradient(180deg, #0b0d12, #05060a 60%);
  min-height:100vh;
}
.wrap{ max-width:1200px; margin:0 auto; padding:22px 18px 60px; }

.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap; }
.brand{ font-size:26px; font-weight:900; letter-spacing:.3px; }
.brand small{ font-size:13px; font-weight:400; color:var(--muted); margin-left:8px; }

.settingsBtn{
  padding:10px 16px; border-radius:12px; background:var(--btn); border:1px solid var(--border);
  color:var(--text); text-decoration:none; font-weight:800; font-size:14px;
}
.settingsBtn:hover{ background:var(--btnHover); }

.clockBlock{ text-align:center; margin:0; }
.clockBlock .time{ font-size:76px; font-weight:900; letter-spacing:.5px; line-height:1; }
.clockBlock .date{ margin-top:14px; font-size:24px; font-weight:700; color:var(--muted); }
@media (max-width:560px){ .clockBlock .time{ font-size:52px; } .clockBlock .date{ font-size:19px; } }

.carousel{
  position:relative; margin:10px 0 28px; border-radius:20px; overflow:hidden;
  background:linear-gradient(165deg, var(--panel), var(--panel2));
  border:1px solid var(--border); box-shadow:0 14px 34px var(--shadow);
  touch-action:pan-y;
}
.carouselTrack{ display:flex; transition:transform .3s ease; }
.carouselSlide{
  flex:0 0 100%; min-width:100%; box-sizing:border-box;
  padding:30px 20px 22px; cursor:pointer; user-select:none;
  display:flex; flex-direction:column; justify-content:center;
}
.carouselDots{ display:flex; justify-content:center; gap:8px; padding:4px 0 16px; }
.carouselDot{
  width:8px; height:8px; border-radius:999px; background:var(--border); cursor:pointer;
  transition:background .15s ease, transform .15s ease;
}
.carouselDot.active{ background:#60a5fa; transform:scale(1.3); }

.slideTitle{
  font-size:13px; font-weight:900; color:var(--muted); text-transform:uppercase;
  letter-spacing:.08em; text-align:center; margin-bottom:16px;
}
.expList{ display:flex; flex-direction:column; gap:4px; max-height:220px; overflow-y:auto; }
.expRow{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding:9px 0; border-top:1px solid var(--border);
}
.expRow:first-child{ border-top:none; }
.expName{ font-weight:800; font-size:15px; }
.expMeta{ color:var(--muted); font-size:12px; margin-top:2px; }
.expLabel{ font-weight:800; font-size:13px; white-space:nowrap; }
.expLabel.expired, .expLabel.today{ color:#f87171; }
.expLabel.soon{ color:#f59e0b; }
.glanceTemp{ font-size:68px; font-weight:900; line-height:1; text-align:center; }
.glanceCond{ text-align:center; color:var(--muted); font-size:20px; font-weight:700; margin-top:10px; }
.glanceSub{ text-align:center; color:var(--muted); font-size:16px; margin-top:16px; }
.glanceHoliday{ text-align:center; margin-top:20px; font-size:17px; font-weight:800; color:#a78bfa; }
@media (max-width:560px){ .glanceTemp{ font-size:48px; } }

.searchRow{ margin-bottom:20px; text-align:center; }
#search{
  width:100%; max-width:420px; padding:12px 16px; border-radius:14px; border:1px solid var(--border);
  background:rgba(17,24,38,.5); color:var(--text); font-size:15px; outline:none;
}
#search:focus{ border-color:rgba(96,165,250,.6); box-shadow:0 0 0 3px rgba(96,165,250,.15); }

.grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;
}
@media (max-width:900px){ .grid{ grid-template-columns:repeat(2, 1fr); } }
@media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

.tile{
  position:relative;
  border-radius:20px;
  padding:20px;
  background:linear-gradient(165deg, var(--panel), var(--panel2));
  border:1px solid var(--border);
  box-shadow:0 14px 34px var(--shadow);
  text-decoration:none;
  color:var(--text);
  display:block;
  overflow:hidden;
  transition:transform .12s ease, border-color .15s ease;
}
.tile::before{
  content:""; position:absolute; inset:0 0 auto 0; height:4px;
  background:var(--accent, #60a5fa);
}
.tile:hover{ transform:translateY(-2px); border-color:var(--accent, #60a5fa); }
.tile.offline{ filter:grayscale(0.85); opacity:.6; pointer-events:auto; }
.tile.offline:hover{ transform:none; }

.tileLabel{ font-size:19px; font-weight:900; margin-bottom:6px; }
.tileMeta{ color:var(--muted); font-size:13px; }
.tileStatus{ display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13px; font-weight:800; }
.dot{ width:9px; height:9px; border-radius:999px; display:inline-block; }
.dot.up{ background:#34d399; box-shadow:0 0 8px rgba(52,211,153,.7); }
.dot.down{ background:#6b7280; }

.empty{ color:var(--muted); padding:40px 0; text-align:center; }

#weatherSection{ margin-top:34px; display:flex; flex-direction:column; gap:16px; }
.sectionTitle{ font-size:15px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:0 0 4px 2px; }
.wxCard{
  background:linear-gradient(165deg, var(--panel), var(--panel2));
  border:1px solid var(--border); border-radius:20px; padding:20px; box-shadow:0 14px 34px var(--shadow);
}
.wxTitle{ font-size:17px; font-weight:900; margin-bottom:10px; }
.wxTemp{ font-size:34px; font-weight:900; line-height:1; }
.wxCond{ font-size:15px; font-weight:700; color:var(--muted); }
.wxSub{ color:var(--muted); font-size:13px; margin-top:6px; }
.wxTableWrap{ overflow-x:auto; margin-top:10px; }
.wxTable{ width:100%; border-collapse:collapse; }
.wxTable th,.wxTable td{ padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; text-align:left; }
.wxTable th{ color:var(--muted); font-weight:900; }
.wxTable tr:last-child td{ border-bottom:none; }
.wxAlertRow, .wxForecastRow{ padding:10px 0; border-top:1px solid var(--border); }
.wxAlertRow:first-of-type, .wxForecastRow:first-of-type{ border-top:none; }
.wxForecastHead{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.wxForecastName{ font-weight:900; font-size:15px; }
.wxForecastTemp{ font-size:19px; font-weight:900; }
.wxDetail{ font-size:12px; color:var(--muted); margin-top:4px; }
.wxRadarWrap{ border-radius:14px; overflow:hidden; border:1px solid var(--border); margin-top:10px; }
.wxStorm{ border-color:rgba(245,158,11,.5) !important; }

.footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:40px; }
</style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">StockHive<small>launcher</small></div>
    <a class="settingsBtn" href="/settings">Settings</a>
  </div>

  <div class="carousel" id="carousel">
    <div class="carouselTrack" id="carouselTrack">
      <div class="carouselSlide">
        <div class="clockBlock">
          <div class="time" id="time">--:--</div>
          <div class="date" id="date">---</div>
        </div>
      </div>
      <div class="carouselSlide">
        <div class="slideTitle">Expiring Soon</div>
        <div id="expiringBody" class="expList"><div class="empty">Loading…</div></div>
      </div>
      <div class="carouselSlide">
        <div class="slideTitle">Today at a Glance</div>
        <div id="glanceBody"><div class="empty">Loading…</div></div>
      </div>
    </div>
    <div class="carouselDots" id="carouselDots"></div>
  </div>

  <div class="searchRow">
    <input id="search" type="text" placeholder="Search instances…" oninput="applyFilter()">
  </div>

  <div id="grid" class="grid"></div>

  <div id="weatherSection"></div>

  <div class="footer" id="hostline"></div>
</div>

<script>
let allNodes = [];

const THEME_ACCENTS = { dark: "#60a5fa", light: "#f59e0b", dim: "#a78bfa" };

function esc(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function tick(){
  const d = new Date();
  document.getElementById("time").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  document.getElementById("date").textContent =
    d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
}
tick(); setInterval(tick, 1000);
document.getElementById("hostline").textContent = location.host;

// ===== Carousel: date/time, expiring soon, today at a glance =====
const SLIDE_COUNT = 3;
const AUTO_ADVANCE_MS = 10000;
const PAUSE_AFTER_MANUAL_MS = 30000;
let currentSlide = 0;
let lastInteraction = 0;

const carouselTrack = document.getElementById("carouselTrack");
const carouselDots = document.getElementById("carouselDots");

function buildDots(){
  carouselDots.innerHTML = "";
  for(let i = 0; i < SLIDE_COUNT; i++){
    const dot = document.createElement("div");
    dot.className = "carouselDot" + (i === 0 ? " active" : "");
    dot.addEventListener("click", () => goToSlide(i, true));
    carouselDots.appendChild(dot);
  }
}
buildDots();

function goToSlide(index, manual){
  currentSlide = ((index % SLIDE_COUNT) + SLIDE_COUNT) % SLIDE_COUNT;
  carouselTrack.style.transform = `translateX(-${currentSlide * 100}%)`;
  [...carouselDots.children].forEach((dot, i) => dot.classList.toggle("active", i === currentSlide));
  if(manual) lastInteraction = Date.now();
}

setInterval(() => {
  if(Date.now() - lastInteraction > PAUSE_AFTER_MANUAL_MS) goToSlide(currentSlide + 1, false);
}, AUTO_ADVANCE_MS);

// Pointer Events cover touch (tap + swipe) and mouse in one code path —
// avoids the double-fire you'd get mixing touchend + a synthetic click.
let pointerDown = false, pointerStartX = 0, pointerStartY = 0, pointerMoved = false;
carouselTrack.addEventListener("pointerdown", (e) => {
  pointerDown = true;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  pointerMoved = false;
  // Keeps move/up events targeting this element even if the finger drifts
  // outside its bounds mid-swipe — without this, a swipe that ends off
  // the carousel never fires pointerup here and pointerDown gets stuck.
  carouselTrack.setPointerCapture(e.pointerId);
});
carouselTrack.addEventListener("pointermove", (e) => {
  if(!pointerDown) return;
  if(Math.abs(e.clientX - pointerStartX) > 10 || Math.abs(e.clientY - pointerStartY) > 10) pointerMoved = true;
});
carouselTrack.addEventListener("pointerup", (e) => {
  if(!pointerDown) return;
  pointerDown = false;
  const dx = e.clientX - pointerStartX;
  if(Math.abs(dx) > 40){
    goToSlide(currentSlide + (dx < 0 ? 1 : -1), true);
  } else if(!pointerMoved){
    goToSlide(currentSlide + 1, true);
  }
});
carouselTrack.addEventListener("pointercancel", () => { pointerDown = false; });

async function loadExpiring(){
  const body = document.getElementById("expiringBody");
  try {
    const r = await fetch("/api/expiring");
    if(!r.ok) return;
    const items = await r.json();
    if(!items.length){
      body.innerHTML = '<div class="empty">Nothing expiring soon.</div>';
      return;
    }
    body.innerHTML = items.map(it => `
      <div class="expRow">
        <div>
          <div class="expName">${esc(it.name)}</div>
          <div class="expMeta">${esc(it.node_label || "")} &bull; ${esc(it.location || "")} &bull; qty ${esc(it.quantity)}</div>
        </div>
        <div class="expLabel ${esc(it.level || "soon")}">${esc(it.label || it.expiration_date || "")}</div>
      </div>
    `).join("");
  } catch(e){}
}
loadExpiring();
setInterval(loadExpiring, 60000);

// Built-in US holiday list — no external service. Fixed-date ones plus
// the common floating ones (Nth weekday of a month), computed locally.
const FIXED_HOLIDAYS = [
  [0, 1, "New Year's Day"],
  [1, 14, "Valentine's Day"],
  [5, 19, "Juneteenth"],
  [6, 4, "Independence Day"],
  [9, 31, "Halloween"],
  [10, 11, "Veterans Day"],
  [11, 25, "Christmas Day"],
];

function nthWeekdayOfMonth(year, month, weekday, n){
  const d = new Date(year, month, 1);
  let count = 0;
  while(true){
    if(d.getDay() === weekday){
      count++;
      if(count === n) return new Date(d);
    }
    d.setDate(d.getDate() + 1);
  }
}
function lastWeekdayOfMonth(year, month, weekday){
  const d = new Date(year, month + 1, 0);
  while(d.getDay() !== weekday) d.setDate(d.getDate() - 1);
  return d;
}
function floatingHolidays(year){
  return [
    [nthWeekdayOfMonth(year, 0, 1, 3), "Martin Luther King Jr. Day"],
    [nthWeekdayOfMonth(year, 1, 1, 3), "Presidents' Day"],
    [nthWeekdayOfMonth(year, 4, 0, 2), "Mother's Day"],
    [lastWeekdayOfMonth(year, 4, 1), "Memorial Day"],
    [nthWeekdayOfMonth(year, 5, 0, 3), "Father's Day"],
    [nthWeekdayOfMonth(year, 8, 1, 1), "Labor Day"],
    [nthWeekdayOfMonth(year, 10, 4, 4), "Thanksgiving"],
  ];
}
function sameDay(a, b){
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function getHolidayLine(){
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  // Build both this year's and next year's list so a window spanning
  // Dec 29-31 still finds the upcoming Jan 1.
  const all = [];
  for(const year of [today.getFullYear(), today.getFullYear() + 1]){
    all.push(...FIXED_HOLIDAYS.map(([m, d, name]) => [new Date(year, m, d), name]));
    all.push(...floatingHolidays(year));
  }
  for(let offset = 0; offset <= 3; offset++){
    const check = new Date(today);
    check.setDate(check.getDate() + offset);
    const hit = all.find(([d]) => sameDay(d, check));
    if(hit){
      if(offset === 0) return `Today is ${hit[1]}`;
      if(offset === 1) return `Tomorrow is ${hit[1]}`;
      return `${hit[1]} is in ${offset} days`;
    }
  }
  return null;
}

function renderTodayGlance(d){
  const wx = d.weather || {};
  const body = document.getElementById("glanceBody");
  if(!body) return;
  let html = "";
  if(wx.ok){
    html += `<div class="glanceTemp">${esc(wx.temp)}</div>
      <div class="glanceCond">${esc(wx.condition)}</div>
      <div class="glanceSub">High/Low: <b>${esc(wx.hi)}</b>/<b>${esc(wx.lo)}</b> &bull; Precip: <b>${esc(wx.precip)}</b></div>`;
  } else {
    html += `<div class="glanceCond">Weather unavailable right now.</div>`;
  }
  const holiday = getHolidayLine();
  if(holiday) html += `<div class="glanceHoliday">${esc(holiday)}</div>`;
  body.innerHTML = html;
}
// ===== end carousel =====

function renderGrid(nodes){
  const grid = document.getElementById("grid");
  if(!nodes.length){
    grid.innerHTML = '<div class="empty">No StockPi instances discovered yet. Make sure a node is powered on and on the same network.</div>';
    return;
  }
  grid.innerHTML = nodes.map(n => {
    const accent = THEME_ACCENTS[n.theme] || THEME_ACCENTS.dark;
    const statusHtml = n.is_online
      ? '<span class="dot up"></span>Online'
      : '<span class="dot down"></span>Offline since ' + esc(n.offline_since || "unknown");
    const href = n.is_online && n.url ? n.url : "#";
    const cls = "tile" + (n.is_online ? "" : " offline");
    return `<a class="${cls}" style="--accent:${accent}" href="${href}">
      <div class="tileLabel">${esc(n.label)}</div>
      <div class="tileMeta">${esc(n.ip || "")}</div>
      <div class="tileStatus">${statusHtml}</div>
    </a>`;
  }).join("");
}

function applyFilter(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = q ? allNodes.filter(n => n.label.toLowerCase().includes(q)) : allNodes;
  renderGrid(filtered);
}

async function loadNodes(){
  try {
    const r = await fetch("/api/nodes");
    if(!r.ok) return;
    allNodes = await r.json();
    applyFilter();
  } catch(e){}
}
loadNodes();
setInterval(loadNodes, 10000);

function buildWeather(d){
  const wx = d.weather || {};
  let html = '<div class="sectionTitle">Weather</div>';
  for(const section of (d.weather_sections || [])){
    if(section === "current"){
      html += `<div class="wxCard"><div class="wxTitle">${esc(wx.location)}</div>`;
      if(wx.ok){
        html += `<div class="wxTemp">${esc(wx.temp)} <span class="wxCond">${esc(wx.condition)}</span></div>
          <div class="wxSub">High/Low: <b>${esc(wx.hi)}</b>/<b>${esc(wx.lo)}</b> &bull; Precip: <b>${esc(wx.precip)}</b></div>
          <div class="wxSub">Updated: ${esc(wx.updated)}</div>`;
      } else {
        html += `<div class="wxSub">Weather unavailable right now.</div>`;
      }
      html += `</div>`;
    }
    else if(section === "hourly" && d.hourly && d.hourly.length){
      html += `<div class="wxCard"><div class="wxTitle">Hourly Forecast</div>
        <div class="wxTableWrap"><table class="wxTable">
          <thead><tr><th>Time</th><th>Temp</th><th>Condition</th><th>Precip</th><th>Wind</th></tr></thead>
          <tbody>`;
      for(const r of d.hourly)
        html += `<tr><td>${esc(r.time)}</td><td><b>${esc(r.temp)}</b></td><td>${esc(r.cond)}</td><td>${esc(r.precip)}</td><td>${esc(r.wind)}</td></tr>`;
      html += `</tbody></table></div></div>`;
    }
    else if(section === "alerts" && d.alerts && d.alerts.length){
      html += `<div class="wxCard"><div class="wxTitle">Active Alerts</div>`;
      for(const a of d.alerts)
        html += `<div class="wxAlertRow"><div style="font-weight:900">${esc(a.headline)}</div>
          <div class="wxSub">${esc(a.when)}</div>
          <div style="margin-top:6px">${esc(a.desc)}</div></div>`;
      html += `</div>`;
    }
    else if(section === "forecast" && d.forecast && d.forecast.length){
      html += `<div class="wxCard"><div class="wxTitle">Tomorrow's Forecast</div>`;
      for(const p of d.forecast)
        html += `<div class="wxForecastRow">
          <div class="wxForecastHead"><div class="wxForecastName">${esc(p.name)}</div><div class="wxForecastTemp">${esc(p.temp)}</div></div>
          <div class="wxSub">${esc(p.cond)}</div>
          <div class="wxSub">Precip: <b>${esc(p.precip)}</b> &bull; Wind: <b>${esc(p.wind)}</b></div>
          <div class="wxDetail">${esc(p.detail)}</div>
        </div>`;
      html += `</div>`;
    }
    else if(section === "radar" && d.radar_station){
      html += `<div class="wxCard"><div class="wxTitle">Radar</div>
        <div class="wxRadarWrap"><img src="https://radar.weather.gov/ridge/standard/${esc(d.radar_station)}_loop.gif?t=${Date.now()}" alt="Radar" style="width:100%;display:block;"></div>
      </div>`;
    }
  }
  if(d.storm_banner){
    html += `<div class="wxCard wxStorm"><div class="wxTitle">Storm Proximity</div>
      <div style="margin-top:6px;font-weight:900">${esc(d.storm_banner)}</div></div>`;
  }
  return html;
}

async function loadWeather(){
  try {
    const r = await fetch("/api/weather");
    if(!r.ok) return;
    const d = await r.json();
    document.getElementById("weatherSection").innerHTML = buildWeather(d);
    renderTodayGlance(d);
  } catch(e){}
}
loadWeather();
setInterval(loadWeather, 5 * 60 * 1000);
</script>

</body>
</html>
