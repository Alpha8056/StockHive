server {
    # The port below is patched at install time by setup.sh — lets a node
    # and a launcher share one machine on different ports instead of
    # fighting over 80.
    listen __LISTEN_PORT__ default_server;
    listen [::]:__LISTEN_PORT__ default_server;

    # nginx's own default (1M) is smaller than a single phone camera
    # photo, so it was rejecting photo uploads with a bare 413 before
    # they ever reached Flask's own (friendlier, route-scoped) size
    # checks. Sized well above both a single photo upload and a bundled
    # backup/restore zip.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
