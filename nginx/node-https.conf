# HTTPS for a StockHive node, next to the plain-HTTP site in node.conf
# (which stays exactly as it is). Installed by
# `scripts/https-setup.sh node-install` (or `issue` from the CA machine)
# as /etc/nginx/sites-available/stockpi-node-https.conf, and put back by
# setup.sh if the node already has a certificate.
#
# The port below is filled in at install time (default 443). The
# certificate and key live outside the repo, in /etc/stockhive/tls/,
# so Settings > Update (git pull) never touches them.
server {
    listen __HTTPS_PORT__ ssl default_server;
    listen [::]:__HTTPS_PORT__ ssl default_server;

    ssl_certificate     /etc/stockhive/tls/node.crt;
    ssl_certificate_key /etc/stockhive/tls/node.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:stockhive_ssl:1m;

    # Same as node.conf: a phone photo is bigger than nginx's 1M default.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
